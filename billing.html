<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing & Payment Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        header { background-color: #007bff; color: white; text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 22px; }
        .logout-btn { background: white; color: #007bff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .logout-btn:hover { background: #e7f1ff; }
        .section-title { margin: 25px 0 15px 0; font-size: 20px; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .orders-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .order-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 5px solid #007bff; display: flex; flex-direction: column; justify-content: space-between; }
        .billing-card { border-top: 5px solid #ffc107; }
        .history-card { border-top: 5px solid #28a745; background: #fafafa; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .table-badge { background: #e7f1ff; color: #007bff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .order-time { font-size: 12px; color: #777; margin-bottom: 10px; }
        .item-list { list-style: none; margin-bottom: 15px; max-height: 150px; overflow-y: auto; }
        .item-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #f0f0f0; font-size: 14px; }
        .item-qty { font-weight: bold; color: #007bff; }
        .order-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 12px; }
        .total-price { font-weight: bold; font-size: 16px; }
        .btn { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .pay-btn { background: #28a745; color: white; }
        .pay-btn:hover { background: #218838; }
        .print-btn { background: #17a2b8; color: white; margin-left: 5px; }
        .print-btn:hover { background: #138496; }
        .no-orders { text-align: center; grid-column: 1 / -1; padding: 25px; color: #777; font-size: 15px; background: white; border-radius: 10px; }
    </style>
</head>
<body>
    <!-- Staff Secure Login Modal -->
    <div id="staffLoginModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <div style="background: white; padding: 30px; border-radius: 14px; width: 90%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center;">
            <h2 style="color: #1b5e20; margin-bottom: 8px; font-size: 22px;">🔒 Staff Secure Login</h2>
            <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Kripya apna email aur password darj karein.</p>
            
            <div style="margin-bottom: 12px; text-align: left;">
                <input type="email" id="staffEmail" placeholder="Email (उदा. admin@restaurant.com)" style="width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none;">
            </div>
            <div style="margin-bottom: 20px; text-align: left;">
                <input type="password" id="staffPass" placeholder="Password" style="width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none;">
            </div>

            <button onclick="loginStaff()" style="background: #2e7d32; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(46,125,50,0.3);">Login Karein ➔</button>
        </div>
    </div>

    <header>
        <h1>🧾 Billing & Payment Counter</h1>
        <button class="logout-btn" onclick="logoutStaff()">Logout 🚪</button>
    </header>

    <div class="container">
        <!-- 1. Live Orders -->
        <h2 class="section-title">⚡ Live Orders (Kitchen)</h2>
        <div class="orders-container" id="liveOrdersContainer">
            <div class="no-orders">लाइव ऑर्डर्स लोड हो रहे हैं...</div>
        </div>

        <!-- 2. Pending Billing -->
        <h2 class="section-title">💳 Pending Billing & Payments</h2>
        <div class="orders-container" id="billingOrdersContainer">
            <div class="no-orders">पेंडिंग बिल लोड हो रहे हैं...</div>
        </div>

        <!-- 3. Payment History -->
        <h2 class="section-title">📂 Payment History / Completed Orders</h2>
        <div class="orders-container" id="historyOrdersContainer">
            <div class="no-orders">हिस्ट्री लोड हो रही है...</div>
        </div>
    </div>

    <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Firebase SDK v8 Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKd6fa9cakNb-U8G2PeIX9Ku_qA8Gs8ok",
            authDomain: "restaurent-fad84.firebaseapp.com",
            projectId: "restaurent-fad84",
            databaseURL: "https://restaurent-fad84-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Session persistence set kiya taaki tab close hone par auto logout ho jaye
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION)
            .catch((error) => {
                console.error("Persistence error:", error);
            });

        // Page khulte hi check karein ki staff logged-in hai ya nahi
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById("staffLoginModal").style.display = "none";
                fetchBillingData();
            } else {
                document.getElementById("staffLoginModal").style.display = "flex";
            }
        });

        function loginStaff() {
            const email = document.getElementById("staffEmail").value.trim();
            const pass = document.getElementById("staffPass").value.trim();

            if (!email || !pass) {
                alert("Kripya Email aur Password dono bharein!");
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Login successful
                })
                .catch((error) => {
                    alert("❌ Login Failed: " + error.message);
                });
        }

        function logoutStaff() {
            firebase.auth().signOut().then(() => {
                location.reload();
            });
        }

        const FIREBASE_URL = "https://restaurent-fad84-default-rtdb.firebaseio.com/";

        async function fetchBillingData() {
            if (!firebase.auth().currentUser) return;

            try {
                const liveRes = await fetch(FIREBASE_URL + "orders.json");
                const liveData = await liveRes.json();

                const billingRes = await fetch(FIREBASE_URL + "billing.json");
                const billingData = await billingRes.json();

                const historyRes = await fetch(FIREBASE_URL + "history.json");
                const historyData = await historyRes.json();

                renderLive(liveData);
                renderBilling(billingData);
                renderHistory(historyData);
            } catch (error) {
                console.error("डेटा फेच करने में एरर:", error);
            }
        }

        function renderLive(data) {
            const container = document.getElementById("liveOrdersContainer");
            container.innerHTML = "";
            if (!data) {
                container.innerHTML = `<div class="no-orders">कोई नया लाइव ऑर्डर नहीं है।</div>`;
                return;
            }
            let count = 0;
            Object.keys(data).forEach(id => {
                const order = data[id];
                if (order && order.customerName && order.items) {
                    container.innerHTML += createCard(id, order, "live", false);
                    count++;
                }
            });
            if (count === 0) container.innerHTML = `<div class="no-orders">कोई नया लाइव ऑर्डर नहीं है।</div>`;
        }

        function renderBilling(data) {
            const container = document.getElementById("billingOrdersContainer");
            container.innerHTML = "";
            if (!data) {
                container.innerHTML = `<div class="no-orders">कोई पेंडिंग बिल नहीं है।</div>`;
                return;
            }
            let count = 0;
            Object.keys(data).forEach(id => {
                const order = data[id];
                if (order && order.customerName && order.items) {
                    container.innerHTML += createCard(id, order, "billing", true);
                    count++;
                }
            });
            if (count === 0) container.innerHTML = `<div class="no-orders">कोई पेंडिंग बिल नहीं है।</div>`;
        }

        function renderHistory(data) {
            const container = document.getElementById("historyOrdersContainer");
            container.innerHTML = "";
            if (!data) {
                container.innerHTML = `<div class="no-orders">कोई पुरानी हिस्ट्री नहीं है।</div>`;
                return;
            }
            let count = 0;
            Object.keys(data).reverse().forEach(id => {
                const order = data[id];
                if (order && order.customerName && order.items) {
                    container.innerHTML += createCard(id, order, "history", false);
                    count++;
                }
            });
            if (count === 0) container.innerHTML = `<div class="no-orders">कोई पुरानी हिस्ट्री नहीं है।</div>`;
        }

        function renderItems(items) {
            let html = "";
            if (items) {
                items.forEach(i => {
                    html += `<li><span>${i.name} (x${i.quantity})</span><span class="item-qty">₹${i.subtotal}</span></li>`;
                });
            }
            return html;
        }

        function createCard(id, order, type, showPayBtn) {
            let cardClass = type === 'billing' ? 'billing-card' : (type === 'history' ? 'history-card' : '');
            const itemsStr = encodeURIComponent(JSON.stringify(order.items || []));
            
            let actionBtn = showPayBtn ? `<button class="btn pay-btn" onclick="paymentDone('${id}')">Payment Done</button>` : '';
            let printBtn = `<button class="btn print-btn" onclick='printBill("${order.customerName}", "${order.tableNumber}", "${order.orderTime}", JSON.parse(decodeURIComponent("${itemsStr}")), ${order.totalBill})'>Print</button>`;

            return `
                <div class="order-card ${cardClass}" id="card-${id}">
                    <div>
                        <div class="order-header">
                            <div>
                                <p>Customer: <b>${order.customerName}</b></p>
                                <p style="font-size: 13px; color: #555;">Mobile No: <b>${order.customerPhone || 'N/A'}</b></p>
                            </div>
                            <span class="table-badge">Table: ${order.tableNumber}</span>
                        </div>
                        <div class="order-time">⏰ ${order.orderTime}</div>
                        <ul class="item-list">${renderItems(order.items)}</ul>
                    </div>
                    <div class="order-footer">
                        <span class="total-price">कुल: ₹${order.totalBill}</span>
                        <div>${actionBtn} ${printBtn}</div>
                    </div>
                </div>
            `;
        }

        async function paymentDone(orderId) {
            if (confirm("क्या इस ऑर्डर का पेमेंट पूरा हो गया है?")) {
                try {
                    const getRes = await fetch(FIREBASE_URL + `billing/${orderId}.json`);
                    const orderData = await getRes.json();

                    if (!orderData) {
                        alert("ऑर्डर डेटा नहीं मिला!");
                        return;
                    }

                    await fetch(FIREBASE_URL + "history.json", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(orderData)
                    });

                    const deleteRes = await fetch(FIREBASE_URL + `billing/${orderId}.json`, {
                        method: "DELETE"
                    });

                    if (deleteRes.ok) {
                        alert("पेमेंट सफल रहा! ऑर्डर हिस्ट्री में सेव हो गया।");
                        fetchBillingData();
                    }
                } catch (error) {
                    alert("एरर: " + error.message);
                }
            }
        }

        function printBill(name, table, time, items, total) {
            const win = window.open('', '', 'height=600,width=400');
            let rows = '';
            items.forEach(i => {
                rows += `<tr><td>${i.name} (${i.quantity})</td><td style="text-align: right;">₹${i.subtotal}</td></tr>`;
            });
            win.document.write(`
                <html><head><title>Invoice</title><style>body{font-family:monospace;padding:10px;width:300px;margin:auto;}h2,p{text-align:center;margin:5px 0;}table{width:100%;border-collapse:collapse;margin-top:10px;}th,td{padding:5px;font-size:13px;border-bottom:1px dashed #ccc; text-align:left;}.total{font-weight:bold;font-size:15px;text-align:right;margin-top:10px;}</style></head>
                <body>
                    <h2>Restaurant Tax Invoice</h2><hr>
                    <p><b>Name:</b> ${name} | <b>Table:</b> ${table}</p>
                    <p><b>Time:</b> ${time}</p><table><tr><th>Item</th><th style="text-align:right;">Amt</th></tr>${rows}</table>
                    <div class="total">Total: ₹${total}</div><hr><p style="text-align:center;font-size:12px;">Thank You! Visit Again.</p>
                    <script>window.onload=function(){window.print();window.close();}<\/script>
                </body></html>
            `);
            win.document.close();
        }

        setInterval(() => {
            fetchBillingData();
        }, 5000);
    </script>
</body>
</html>
